version: "3"

tasks:
  build:
    desc: Build the site into dist from a checkout of the app repo (APP, default ../araldo)
    vars:
      APP: '{{.APP | default "../araldo"}}'
    cmd: go run ./cmd/build -app {{.APP}} -out dist

  test:
    desc: Run the build's tests
    cmd: go test ./...

  check:
    desc: Format, vet and test
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...
      - go test ./...

  serve:
    desc: Build, then serve dist/site (or HOST=docs) on http://localhost:8000 to look at it
    deps: [build]
    cmd: python -m http.server 8000 --directory dist/{{.HOST | default "site"}}
