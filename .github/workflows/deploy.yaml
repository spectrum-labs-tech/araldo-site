# Builds araldo.dev from this repo and the app repo's docs, and publishes it to the Cloudflare Pages
# project araldo-site. It runs on every push to main, daily (so the app's docs reach the site within
# a day of changing), and by hand. Pull requests only build: nothing is published from a branch, so
# no secret is used where a fork's code could run.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: spectrum-labs-tech/araldo
          path: araldo
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: go run ./cmd/build -app araldo -out dist
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository_owner == 'spectrum-labs-tech'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=araldo-site --branch=main
